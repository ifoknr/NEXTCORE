name: NextCore

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      telegram:
        description: "Post this build to the Telegram channel"
        type: boolean
        default: false
  push:
    branches:
      - main
    # Pushing a tag such as v2.0.0 builds the module and publishes a GitHub Release
    tags:
      - "v*"
    paths:
      - ".github/workflows/build.yml"
      - ".github/scripts/**"
      - "manager/**"
      - "archdaemon/**"
      - "tweakfls/**"
      - "mainfiles/**"
      - "preloadbin/**"
      - "thermalcore/**"
      - "binprofiles/**"
      - "binutils/**"
      - "binpreferenced/**"
      - "nextcoreApplist.json"
      - "version"
      - "version_type"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build NextCore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      
      - name: Verify Module
        run: bash .github/scripts/verify.sh
        
      - name: Copy changelog file
        run: bash .github/scripts/changelog.sh

      - name: Determine Build Type
        id: build_type
        run: |
          # Membaca isi file dan menghapus spasi/newline tersembunyi
          V_TYPE=$(cat version_type | tr -d '\n\r ')
          echo "V_TYPE=$V_TYPE" >> $GITHUB_ENV
          echo "Build mode set to: $V_TYPE"
  
      - name: NDK Setup
        uses: nttld/setup-ndk@v1.6.0
        with:
          ndk-version: r29

      - name: Compile Daemon
        working-directory: ./archdaemon
        run: |
          if [ "$V_TYPE" == "experimental" ]; then
            ndk-build NDK_DEBUG=1
          else
            ndk-build
          fi

      - name: Compile Preload Binary
        working-directory: ./preloadbin
        run: |
          if [ "$V_TYPE" == "experimental" ]; then
            ndk-build NDK_DEBUG=1
          else
            ndk-build
          fi

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build NextCore Thermalcore
        working-directory: ./thermalcore
        run: |
          if [ "$V_TYPE" == "experimental" ]; then
            cargo ndk -t arm64-v8a -t armeabi-v7a build
          else
            cargo ndk -t arm64-v8a -t armeabi-v7a build --release
          fi

      - name: Compile NextCore Profilesettings
        working-directory: ./binprofiles
        run: |
          if [ "$V_TYPE" == "experimental" ]; then
            cargo ndk -t arm64-v8a -t armeabi-v7a build
          else
            cargo ndk -t arm64-v8a -t armeabi-v7a build --release
          fi

      - name: Compile NextCore Utility
        working-directory: ./binutils
        run: |
          if [ "$V_TYPE" == "experimental" ]; then
            cargo ndk -t arm64-v8a -t armeabi-v7a build
          else
            cargo ndk -t arm64-v8a -t armeabi-v7a build --release
          fi
          
      - name: Compile NextCore Preferenced
        working-directory: ./binpreferenced
        run: |
          if [ "$V_TYPE" == "experimental" ]; then
            cargo ndk -t arm64-v8a -t armeabi-v7a build
          else
            cargo ndk -t arm64-v8a -t armeabi-v7a build --release
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Build Manager APK
        working-directory: ./manager
        run: |
          chmod +x ./gradlew
          if [ "$V_TYPE" == "experimental" ]; then
            ./gradlew clean assembleDebug
          else
            ./gradlew clean assembleRelease
          fi
        env:
          KS_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
                    
      - name: Compile Flashable Zip
        id: compileZip
        run: bash .github/scripts/compile_zip.sh

      # Posts releases (a pushed v* tag) to the Telegram channel. A manual run
      # can post too, to test the bot. Needs the BOT_TOKEN and CHAT_ID secrets.
      - name: Post To Telegram
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.telegram)
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$CHAT_ID" ] && [ -n "$BOT_TOKEN" ]; then
            bash .github/scripts/telebot.sh "${{ steps.compileZip.outputs.zipName }}"
          else
            echo "::warning::BOT_TOKEN or CHAT_ID secret is missing, skipping the Telegram post."
          fi

      - name: Upload Module Zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.compileZip.outputs.artifactName }}
          path: ${{ steps.compileZip.outputs.zipName }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: NextCore ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            ${{ steps.compileZip.outputs.zipName }}
            dist/update.json
